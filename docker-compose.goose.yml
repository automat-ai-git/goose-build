networks:
  localai_default:
    external: true

services:
  goose:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goose
    restart: unless-stopped
    stdin_open: true
    tty: true
    group_add:
      - "${DOCKER_GID:-1001}"
      - "2000"
    networks:
      - localai_default
    ports:
      - "7681:7681"
    volumes:
      - ${HOST_HOME}/workspace:/workspace
      - ${HOST_HOME}/goose/sessions:/home/goose/.local/share/goose
      - ${HOST_HOME}/goose/state:/home/goose/.local/state/goose
      - ${HOST_HOME}:/host
      - ${HOST_HOME}/.config/goose:/home/goose/.config/goose
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEETING_DATA_PATH:-/mnt/e/meeting-data}:/meeting-data:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOME=/home/goose
      - HOST_HOME=${HOST_HOME}

      - GOOSE_PROVIDER=openai
      - GOOSE_MODEL=${GOOSE_MODEL:-qwen}
      - OPENAI_API_KEY=none
      - OPENAI_BASE_URL=${LMSTUDIO_BASE_URL:-}
      - OLLAMA_HOST=http://ollama:11434

      - GOOSE_INPUT_LIMIT=131072
      - GOOSE_TEMPERATURE=0.1
      - GOOSE_CONTEXT_STRATEGY=summarize
      - GOOSE_MAX_TURNS=100
      - GOOSE_DISABLE_KEYRING=1
      - GOOSE_TELEMETRY_ENABLED=false
      - 'CONTEXT_FILE_NAMES=["agents/goose/CLAUDE.md", ".goosehints"]'

      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG:-}
      - PLANE_BASE_URL=${PLANE_BASE_URL:-}
